<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a train ticket</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="task1.css">
</head>
<body>

  <div class="ticket-wrapper">
    <div class="ticket-card">
      <div class="ticket-card__header">
        <h2 class="ticket-card__title">Book a train ticket</h2>
      </div>
      <div class="ticket-card__body">
 <form novalidate>
    <div class="trip-toggle" role="radiogroup" aria-label="Trip type">
    <input type="radio" class="btn-check" name="tripType" id="oneWay" autocomplete="off" checked>
    <label class="trip-toggle__btn" for="oneWay">One way</label>

    <input type="radio" class="btn-check" name="tripType" id="roundTrip" autocomplete="off">
    <label class="trip-toggle__btn" for="roundTrip">Round trip</label>
  </div>
  <div class="row g-3 mb-3">
  <div class="col-12 col-md-6">
    <div class="form-floating">
      <input type="text" class="form-control" id="fromCity" placeholder="City" required>
      <label for="fromCity">From</label>
    </div>
  </div>
  <div class="col-12 col-md-6">
    <div class="form-floating">
      <input type="text" class="form-control" id="toCity" placeholder="City" required>
      <label for="toCity">To</label>
    </div>
  </div>
</div>
<div class="row g-3 mb-3">
  <div class="col-12 col-md-4">
    <label for="departure" class="form-label">Departure</label>
    <input type="date" class="form-control" id="departure" required>
  </div>
  <div class="col-12 col-md-4">
    <label for="returnDate" class="form-label">Return</label>
    <input type="date" class="form-control" id="returnDate">
  </div>
  <div class="col-12 col-md-4">
    <label for="passengers" class="form-label">Passengers</label>
    <select class="form-select" id="passengers" required>
      <option value="1" selected>1 adult</option>
      <option value="2">2 adults</option>
      <option value="3">3 adults</option>
      <option value="4">4 adults</option>
      <option value="5">5 adults</option>
      <option value="6">6 adults</option>
    </select>
  </div>
</div>
<div class="mb-3">
  <label class="form-label d-block">Carriage class</label>

  <div class="form-check form-check-inline">
    <input class="form-check-input" type="radio" name="carriageClass" id="seat" value="seat" required>
    <label class="form-check-label" for="seat">Seat</label>
  </div>

  <div class="form-check form-check-inline">
    <input class="form-check-input" type="radio" name="carriageClass" id="coupe" value="coupe" checked>
    <label class="form-check-label" for="coupe">Coupé</label>
  </div>

  <div class="form-check form-check-inline">
    <input class="form-check-input" type="radio" name="carriageClass" id="sleeper" value="sleeper">
    <label class="form-check-label" for="sleeper">Sleeper</label>
  </div>
</div>
<div class="row g-3 mb-3">
  <div class="col-12 col-md-6">
    <label for="phone" class="form-label">Phone</label>
    <div class="input-group">
      <span class="input-group-text">+7</span>
      <input type="tel" class="form-control" id="phone" placeholder="701 234 56 78" required>
    </div>
  </div>
  <div class="col-12 col-md-6">
    <label for="email" class="form-label">Email</label>
    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
  </div>
</div>
<div class="form-check form-switch mb-2">
  <input class="form-check-input" type="checkbox" role="switch" id="smsNotify">
  <label class="form-check-label" for="smsNotify">Also send the ticket by SMS</label>
</div>

<div class="form-check mb-4">
  <input class="form-check-input" type="checkbox" id="agreement" required>
  <label class="form-check-label" for="agreement">I agree with the carriage rules</label>
</div>
<div class="d-flex flex-column-reverse flex-md-row justify-content-md-end gap-2 mt-2">
  <button type="reset" class="btn btn-outline-secondary ticket-btn">Clear</button>
  <button type="submit" class="btn ticket-btn ticket-btn--primary">Find trains</button>
</div>
</form>
      </div>
    </div>
  </div>

</body>
</html>
