<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserve a table</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container py-5" style="max-width: 34rem;">
    <h2 class="mb-4">Reserve a table</h2>

    <form>
      <div class="mb-3">
        <label for="name" class="form-label">Your name</label>
        <input type="text" class="form-control" id="name" name="name" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>

      <div class="mb-3">
        <label for="phone" class="form-label">Phone</label>
        <input type="tel" class="form-control" id="phone" name="phone" required>
      </div>

      <div class="mb-3">
        <label for="guests" class="form-label">Guests</label>
        <input type="number" class="form-control" id="guests" name="guests" min="1" max="20" required>
      </div>

      <div class="mb-3">
        <label for="date" class="form-label">Date</label>
        <input type="date" class="form-control" id="date" name="date" required>
      </div>

      <fieldset class="mb-3">
        <legend class="form-label h6">Seating</legend>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="seating" id="seatingInside" value="inside" required>
          <label class="form-check-label" for="seatingInside">Inside</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="seating" id="seatingTerrace" value="terrace">
          <label class="form-check-label" for="seatingTerrace">Terrace</label>
        </div>
      </fieldset>

      <div class="mb-3">
        <label for="mealTime" class="form-label">Meal time</label>
        <select class="form-select" id="mealTime" name="mealTime" required>
        <option value="" selected disabled>Choose…</option>
          <option value="Lunch">Lunch</option>
          <option value="Dinner">Dinner</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="comments" class="form-label">Comments</label>
        <textarea class="form-control" id="comments" name="comments" rows="3" placeholder="Comments"></textarea>
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
        <label class="form-check-label" for="terms">I agree to the terms</label>
      </div>

      <button type="submit" class="btn btn-primary">Reserve</button>
    </form>
  </div>

</body>
</html>
